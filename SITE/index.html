<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <title>MemeGen</title>
</head>

<body class="main-layout" onload="onInit()"" onresize="resizeCanvas()">
    <header class="main-header">
        <h1>Meme Generator</h1>
    </header>

    <section class="gallery">Gallery
        <!-- <img src="images/1.jpg" alt="img-1" onclick="onSelectImg(1)"> -->
         <div class="gallery-container"></div>
    </section>

    <section class="editor hidden">Editor
        <form action="submit" class="meme-form">
            <label for="lineText">Enter text</label>
            <input 
                    type="text" 
                    name="lineText" 
                    id="lineText"
                    oninput="onTextInput(this)">

        </form>
        <div class="canvas-container">
            <canvas width="400" height="400"></canvas>
        </div>

    </section>

    <script src="js/services/image.service.js"></script>
    <script src="js/services/meme.service.js"></script>
    <script src="js/meme-controller.js"></script>
    <script src="js/gallery-controller.js"></script>
</body>

</html>
