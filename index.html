<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
    <title>MemeGen</title>
</head>

<body class="main-layout" onload="onInit()"" onresize="resizeCanvas()">
    <header class="main-header">
        <h1>Meme Generator</h1>
    </header>

    <section class="gallery">Gallery
        <!-- <img src="images/1.jpg" alt="img-1" onclick="onSelectImg(1)"> -->
         <div class="gallery-container"></div>
    </section>

    <section class="editor hidden">
    <!-- <section class="editor"> -->
        <div class="canvas-container">
            <canvas width="400" height="400"></canvas>
        </div>
        <div class="edit-pannel">
            <form class="edit-form" action="submit" class="meme-form">
                <label for="lineText">Enter text</label>
                <input  type="text"
                        name="lineText"
                        id="lineText"
                        oninput="onTextInput(this.value)">

                        <button type="button" 
                        onclick="onAddLine()">+</button>
                
                        <button type="button" 
                        onclick="onSwitchLine()">🔁</button>
                
                        <button type="button" 
                        onclick="onChangeFontSize(1)">A+</button>
                
                        <button type="button" 
                        onclick="onChangeFontSize(-1)">A-</button>
                
                        <label for="stroke-color">🖌️</label>
                        <input type="color" 
                        name="stroke-color" 
                        id="stroke-color"
                        oninput="onSetStrokeColor(this.value)">
                        
                        <label for="fill-color">🎨</label>
                        <input type="color" 
                            name="fill-color" 
                            id="fill-color"
                             oninput="onSetFillColor(this.value)">
                        
                        <select 
                        name="font-family" 
                        id="font-family" 
                        class="font-family" 
                        onchange="onSetFontFamily(this.value)">
                            <option value="arial">Arial</option>
                            <option value="verdana">Verdana</option>
                            <option value="cursive">Cursive</option>
                        </select>
                        
                        <select 
                        name="font-style" 
                        id="font-style" 
                        class="font-style" 
                        onchange="onSetFontStyle(this.value)">
                            <option value="bold">B</option>
                            <option value="underline">U</option>
                            <option value="italic">I</option>
                        </select>
                        
                        <select 
                        name="text-align" 
                        id="text-align" 
                        class="text-align" 
                        onchange="onSetTextAlign(this)">
                        <option value="left">◀️</option>
                        <option value="center">↔️</option>
                            <option value="right">▶️</option>
                        </select>
            </form>
            <div class="share">
                <button type="button" class="download-btn">
                    <a href="#" download="my-meme.png" onclick=onDownloadCanvas(this)>Download</a>
                </button>
            </div>
        </div>

    </section>

    <script src="js/services/image.service.js"></script>
    <script src="js/services/meme.service.js"></script>
    <script src="js/meme-controller.js"></script>
    <script src="js/gallery-controller.js"></script>
</body>

</html>
