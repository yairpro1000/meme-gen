<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://kit.fontawesome.com/1f7ec8900e.js" crossorigin="anonymous"></script>


    <link rel="stylesheet" href="styles/styles.css">
    <title>MemeGen</title>
</head>

<body class="main-layout" onload="onInit()" onresize=" resizeCanvas()">
    <div class="background">
        <img src="images/svg/background-rays.svg" alt="">
    </div>


    <header class="main-header main-layout full">
        <div class="header-container">
            <h1>Logo</h1>
            <nav class="main-nav">
                <a href="#" onclick="showGallery()">Gallery</a>
                <a href="#" onclick="showEditor()">Editor</a>
            </nav>
        </div>
    </header>


    <!-- <main class="main-content full main-layout"> -->

    <section class="gallery full main-layout">
        <div class="gallery-wrapper full main-layout">
            <div class="gallery-search full">
                <input type="search" name="keyword-search" id="keyword-search" class="keyword-search"
                    placeholder="Search" oninput="onFilter(this.value)">
                <div class="gallery-keywords"></div>
                <button type="button" class="more-keywords" onclick="onMore()">More</button>
                <div class="btn-3d file-picker-wrapper"><input class="file-picker" type="file" name="image"
                        onchange="onImgInput(event)"></div>
            </div>
            <div class="gallery-box">
                <div class="gallery-container"></div>
            </div>
        </div>
    </section>

    <section class="editor hidden">
        <div class="btn-3d file-picker-wrapper"><input class="file-picker" type="file" name="image"
            onchange="onImgInput(event)"></div>
        <!-- <section class="editor"> -->
        <div class="canvas-container">
            <canvas width="400" height="400"></canvas>
        </div>
        <div class="edit-pannel">
            <!-- <form class="edit-form" action="submit" class="meme-form"> -->
            <div class="meme-text btn-3d">
                <input type="text" name="lineText" id="lineText" oninput="onTextInput(this.value)">
            </div>

            <div class="line-manager">
                <!-- <div class="btn-3d switch-line" onclick="onSwitchLine()"> -->
                <div class="btn-3d switch-line" onclick="hideElement(this)">
                    <div class="btn-wrapper">
                        <svg class="icon" width="100" height="100" viewBox="0 0 100 100"
                            xmlns="http://www.w3.org/2000/svg">
                            <!-- Up arrow -->
                            <path d="M32 18L18 36H26V76H38V36H46L32 18Z" fill="currentColor" />

                            <!-- Down arrow -->
                            <path d="M68 82L82 64H74V24H62V64H54L68 82Z" fill="currentColor" />
                        </svg>
                        <svg class="icon" width="100" height="100" viewBox="0 0 100 100"
                            xmlns="http://www.w3.org/2000/svg">
                            <!-- Up arrow -->
                            <path d="M32 18L18 36H26V76H38V36H46L32 18Z" fill="currentColor" />

                            <!-- Down arrow -->
                            <path d="M68 82L82 64H74V24H62V64H54L68 82Z" fill="currentColor" />
                        </svg>
                    </div>
                    <!-- <button type="button" onclick="onSwitchLine()">🔁</button> -->
                </div>
                <div class="btn-3d add-line" onclick="onAddLine()">
                    <div class="btn-wrapper">
                        <svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <path d="M44 24H56V44H76V56H56V76H44V56H24V44H44Z" fill="currentColor" />
                        </svg>
                        <svg class="icon" width="100" height="100" viewBox="0 0 100 100"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M44 24H56V44H76V56H56V76H44V56H24V44H44Z" fill="currentColor" />
                        </svg>
                    </div>

                </div>
                <div class="trash btn-3d">
                    <div class="btn-wrapper">
                        <i class="fa-solid fa-trash"></i>
                        <i class="fa-solid fa-trash"></i>
                    </div>
                </div>
            </div>

            <div class="line-style">
                <button type="button" class="font-size" onclick="onChangeFontSize(1)">A<span
                        class="super">+</span></button>
                <button type="button" class="font-size" onclick="onChangeFontSize(-1)">A<span
                        class="super">-</span></button>
                
                        <!-- <label for="stroke-color">🖌️</label>
                <input type="color" name="stroke-color" id="stroke-color" oninput="onSetStrokeColor(this.value)"> -->

                <label for="fill-color">
                    <i class="fa-solid fa-palette"></i>
                </label>
                <input type="color" name="fill-color" id="fill-color" oninput="onSetFillColor(this.value)">

                <select name="font-family" id="font-family" class="font-family" onchange="onSetFontFamily(this.value)">
                    <option value="poppins-medium">Poppins</option>
                    <option value="arial">Arial</option>
                    <option value="serif">Serif</option>
                    <option value="cursive">Cursive</option>
                </select>

                <select name="font-style" id="font-style" class="font-style" onchange="onSetFontStyle(this.value)">hello
                    <option value="bold">B</option>
                    <option value="underline">U</option>
                    <option value="italic">I</option>
                </select>

                <div name="text-align" id="font-style" class="text-align" onclick="toggleElementVisible(this)">
                    <button type="button" onclick="onSetTextAlign2('left')" value="left">◀️</button>
                    <button type="button" onclick="onSetTextAlign2('center')" value="center">↔️</button>
                    <button type="button" onclick="onSetTextAlign2('right')" value="right">▶️</button>
                </div>

                <select name="text-align" id="text-align" class="text-align" onchange="onSetTextAlign(this)">
                    <option value="left">◀️</option>
                    <option value="center">↔️</option>
                    <option value="right">▶️</option>
                    <option value="test">
                        <div>
                            <svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                                <path d="M44 24H56V44H76V56H56V76H44V56H24V44H44Z" fill="black" />
                            </svg>
                        </div>
                    </option>
                </select>

            </div>
            <!-- </form> -->
            <div class="share">
                <div class="download-btn btn-3d">
                    <a href="#" download="my-meme.png" onclick=onDownloadCanvas(this)>Download</a>
                </div>

                <div class="share-btn btn-3d">
                    <form method="POST" enctype="multipart/form-data" onsubmit="onUploadImg(event)">
                        <!-- <input name="img" id="imgData" type="hidden" /> -->
                        <button class="btn" type="submit">Upload to Cloud</button>
                    </form>
                </div>

                <div class="share-container"></div>
            </div>
        </div>

    </section>
    <!-- </main> -->


    <div class="test"><img src="" alt=""></div>

    <script src="js/services/image.service.js"></script>
    <script src="js/services/meme.service.js"></script>
    <script src="js/meme-controller.js"></script>
    <script src="js/gallery-controller.js"></script>
</body>

</html>
